<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>muzy — Album Metadata Fetch</title>

<!-- Radix color scales (CDN) -->
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/indigo.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/indigo-alpha.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/gray.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/gray-alpha.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/black-alpha.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/gold.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/gold-alpha.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/jade.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/red.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/red-alpha.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/amber.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/amber-alpha.css" />

<!-- Design tokens + app styles + this feature's styles -->
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="app.css" />
<link rel="stylesheet" href="metadata-fetch.css" />

<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
  #root { width: 100%; height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="metadata-fetch.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;
  const W = 1280, H = 800;

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="entry" title="トリガー & 取得"
          subtitle="アルバム詳細の「アルバム情報を取得」 → フィンガープリント認識(直列 1 req/s)">
          <DCArtboard id="trigger" label="トリガー · アルバム詳細(取得前)" width={W} height={H}>
            <FetchTriggerScreen />
          </DCArtboard>
          <DCArtboard id="fetching" label="取得中 · 認識パイプライン" width={W} height={H}>
            <FetchingScreen />
          </DCArtboard>
        </DCSection>

        <DCSection id="confirm" title="確認シート"
          subtitle="疎結合のモーダルシート。中身ビューは将来の編集インスペクタで再利用 — 表示のみ・行単位の編集なし">
          <DCArtboard id="sheet-b" label="レビュー表(スコア参考表示つき)" width={W} height={H}>
            <ConfirmSheetB />
          </DCArtboard>
        </DCSection>

        <DCSection id="release" title="Release 選択"
          subtitle="方針B: デフォルト提示 + 変更可能。多数決 → 最古のリリース日でタイブレーク">
          <DCArtboard id="release-pop" label="候補 Release 一覧" width={W} height={H}>
            <ReleasePickerScreen />
          </DCArtboard>
        </DCSection>

        <DCSection id="edge" title="エッジ状態"
          subtitle="該当なし · アート未取得 · 取得失敗 / 一部 failed(いずれも音声には書き込まない)">
          <DCArtboard id="no-match" label="該当なし · 候補ゼロ" width={W} height={H}>
            <NoMatchScreen />
          </DCArtboard>
          <DCArtboard id="no-art" label="アート未取得 · プレースホルダー" width={W} height={H}>
            <NoArtworkScreen />
          </DCArtboard>
          <DCArtboard id="partial-fail" label="取得失敗 · 一部 failed" width={W} height={H}>
            <PartialFailScreen />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
