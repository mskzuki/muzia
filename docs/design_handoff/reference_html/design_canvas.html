<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>muzy — UI Design</title>

<!-- Radix color scales (CDN) -->
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/indigo.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/indigo-alpha.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/gray.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/gray-alpha.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/black-alpha.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/gold.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/gold-alpha.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/jade.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/red.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/red-alpha.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/amber.css" />
<link rel="stylesheet" href="https://unpkg.com/@radix-ui/colors@latest/amber-alpha.css" />

<!-- Design tokens + app styles -->
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="app.css" />

<style>
  html, body { margin: 0; height: 100%; background: #f0eee9; }
  #root { width: 100%; height: 100vh; }
</style>
</head>
<body>
<template id="__bundler_thumbnail">
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
<rect width="100" height="100" rx="18" fill="#3E63DD"/>
<path d="M42 32v23.5a8 8 0 1 1-4-6.9V28l24-4v19.5a8 8 0 1 1-4-6.9V22z" fill="#fff"/>
</svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>
<script type="text/babel" src="screens.jsx"></script>
<script type="text/babel" src="screens2.jsx"></script>
<script type="text/babel" src="screens3.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;
  const W = 1280, H = 800;

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="browse" title="Library — Browse"
          subtitle="3ペイン構成 · サイドバー / コンテンツ / フッタプレーヤー">
          <DCArtboard id="songs" label="Songs · Table" width={W} height={H}>
            <SongsScreen />
          </DCArtboard>
          <DCArtboard id="albums" label="Albums · Grid" width={W} height={H}>
            <AlbumsScreen />
          </DCArtboard>
          <DCArtboard id="artists" label="Artists · List" width={W} height={H}>
            <ArtistsScreen />
          </DCArtboard>
        </DCSection>

        <DCSection id="detail" title="Playlist"
          subtitle="ヒーローヘッダ + トラックリスト">
          <DCArtboard id="playlist" label="Hi-Res Showcase" width={W} height={H}>
            <PlaylistScreen />
          </DCArtboard>
        </DCSection>

        <DCSection id="states" title="First-run & States"
          subtitle="空状態 · インポート進捗">
          <DCArtboard id="empty" label="Empty Library" width={W} height={H}>
            <EmptyScreen />
          </DCArtboard>
          <DCArtboard id="import" label="Import Progress" width={W} height={H}>
            <ImportScreen />
          </DCArtboard>
        </DCSection>

        <DCSection id="deeper" title="Deeper Views"
          subtitle="Genres · Artist 詳細 · Album 詳細">
          <DCArtboard id="genres" label="Genres · Mosaic" width={W} height={H}>
            <GenresScreen />
          </DCArtboard>
          <DCArtboard id="artist-detail" label="Artist · Midnight Arcade" width={W} height={H}>
            <ArtistDetailScreen />
          </DCArtboard>
          <DCArtboard id="album-detail" label="Album · Parallel Lines" width={W} height={H}>
            <AlbumDetailScreen />
          </DCArtboard>
        </DCSection>

        <DCSection id="editing" title="Search & Editing"
          subtitle="コンテキスト検索 · 右クリックメニュー · 曲の編集ダイアログ">
          <DCArtboard id="search" label="Search Results" width={W} height={H}>
            <SearchScreen />
          </DCArtboard>
          <DCArtboard id="context" label="Context Menu" width={W} height={H}>
            <ContextMenuScreen />
          </DCArtboard>
          <DCArtboard id="song-edit" label="Song Edit Dialog" width={W} height={H}>
            <SongEditScreen />
          </DCArtboard>
        </DCSection>

        <DCSection id="bulkedit" title="Album Bulk Edit"
          subtitle="複数選択 → 一括編集ボタン → アルバム情報ドロワー → 確認ダイアログ">
          <DCArtboard id="multi" label="Multi-select" width={W} height={H}>
            <MultiSelectScreen />
          </DCArtboard>
          <DCArtboard id="bulk-drawer" label="Bulk Edit Drawer · 分割" width={W} height={H}>
            <BulkEditScreen />
          </DCArtboard>
          <DCArtboard id="bulk-confirm" label="Confirm Changes" width={W} height={H}>
            <BulkConfirmScreen />
          </DCArtboard>
        </DCSection>

        <DCSection id="states2" title="Edge States & Settings"
          subtitle="ファイル欠落 · 重複検出 · データエラー · 環境設定">
          <DCArtboard id="missing" label="Missing Files" width={W} height={H}>
            <MissingFilesScreen />
          </DCArtboard>
          <DCArtboard id="dupe" label="Duplicate Review" width={W} height={H}>
            <DuplicateScreen />
          </DCArtboard>
          <DCArtboard id="error" label="Data Error Alert" width={W} height={H}>
            <ErrorAlertScreen />
          </DCArtboard>
          <DCArtboard id="prefs" label="Preferences Window" width={W} height={H}>
            <PrefsScreen />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
